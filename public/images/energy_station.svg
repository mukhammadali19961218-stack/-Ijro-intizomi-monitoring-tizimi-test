<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="stationFadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0"/>
      <stop offset="20%" stop-color="#bfdbfe" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Ground Reference Line -->
  <line x1="5" y1="52" x2="255" y2="52" stroke="url(#stationFadeGrad)" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- Substation Takeoff Lines from Left (connecting perspective to pylons) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="0.9" fill="none">
    <path d="M0 24 Q50 32 105 28"/>
    <path d="M0 32 Q50 38 105 34"/>
    <path d="M0 40 Q50 44 105 40"/>
  </g>

  <!-- Cooling Tower 1 (Hyperbolic Natural Draft - x around 60) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Rim -->
    <ellipse cx="60" cy="14" rx="14" ry="2"/>
    
    <!-- Hyperbolic Curved Walls -->
    <path d="M46 14 Q53 32 40 50 L40 52"/>
    <path d="M74 14 Q67 32 80 50 L80 52"/>

    <!-- Bottom Air Inlet Diagonal Supports (V-lattice base) -->
    <line x1="42" y1="52" x2="45" y2="47"/>
    <line x1="48" y1="52" x2="45" y2="47"/>
    <line x1="48" y1="52" x2="51" y2="47"/>
    <line x1="54" y1="52" x2="51" y2="47"/>
    <line x1="54" y1="52" x2="57" y2="47"/>
    <line x1="60" y1="52" x2="57" y2="47"/>
    <line x1="60" y1="52" x2="63" y2="47"/>
    <line x1="66" y1="52" x2="63" y2="47"/>
    <line x1="66" y1="52" x2="69" y2="47"/>
    <line x1="72" y1="52" x2="69" y2="47"/>
    <line x1="72" y1="52" x2="75" y2="47"/>
    <line x1="78" y1="52" x2="75" y2="47"/>
    
    <!-- Subtle Stiffening Rings -->
    <path d="M49 26 Q60 28 71 26" stroke-width="0.8"/>
    <path d="M46 38 Q60 41 74 38" stroke-width="0.8"/>
  </g>

  <!-- Cooling Tower 2 (x around 125, slightly larger in foreground) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Rim -->
    <ellipse cx="125" cy="11" rx="16" ry="2.2"/>
    
    <!-- Hyperbolic Curved Walls -->
    <path d="M109 11 Q117 30 102 50 L102 52"/>
    <path d="M141 11 Q133 30 148 50 L148 52"/>

    <!-- Bottom Air Inlet Diagonal Supports -->
    <line x1="104" y1="52" x2="108" y2="47"/>
    <line x1="112" y1="52" x2="108" y2="47"/>
    <line x1="112" y1="52" x2="116" y2="47"/>
    <line x1="120" y1="52" x2="116" y2="47"/>
    <line x1="120" y1="52" x2="124" y2="47"/>
    <line x1="128" y1="52" x2="124" y2="47"/>
    <line x1="128" y1="52" x2="132" y2="47"/>
    <line x1="136" y1="52" x2="132" y2="47"/>
    <line x1="136" y1="52" x2="140" y2="47"/>
    <line x1="144" y1="52" x2="140" y2="47"/>
    <line x1="144" y1="52" x2="147" y2="47"/>

    <!-- Structural Rings -->
    <path d="M113 24 Q125 26 137 24" stroke-width="0.8"/>
    <path d="M109 37 Q125 40 141 37" stroke-width="0.8"/>
  </g>

  <!-- Power Plant Boiler / Turbine Hall Building (x 155 to 215) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Boiler House (Taller block) -->
    <rect x="156" y="22" width="34" height="30"/>
    <line x1="156" y1="28" x2="190" y2="28" stroke-width="0.75"/>
    <line x1="156" y1="36" x2="190" y2="36" stroke-width="0.75"/>
    <line x1="156" y1="44" x2="190" y2="44" stroke-width="0.75"/>

    <!-- Vertical Structural Columns -->
    <line x1="165" y1="22" x2="165" y2="52" stroke-width="0.75"/>
    <line x1="173" y1="22" x2="173" y2="52" stroke-width="0.75"/>
    <line x1="181" y1="22" x2="181" y2="52" stroke-width="0.75"/>

    <!-- Turbine Hall (Longer lower building) -->
    <rect x="190" y="32" width="46" height="20"/>
    <!-- Sawtooth / Industrial Roof detail -->
    <path d="M190 32 L196 28 L196 32 L204 28 L204 32 L212 28 L212 32 L220 28 L220 32 L228 28 L228 32 L236 32"/>
    <line x1="198" y1="38" x2="228" y2="38" stroke-width="0.75"/>
    <line x1="198" y1="45" x2="228" y2="45" stroke-width="0.75"/>
  </g>

  <!-- Industrial Exhaust Chimneys / Stacks (Tall slender) -->
  <!-- Chimney 1 (x=168) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <line x1="167" y1="5" x2="165" y2="22"/>
    <line x1="170" y1="5" x2="172" y2="22"/>
    <line x1="166" y1="5" x2="171" y2="5"/>
    <!-- Inspection platforms / safety rings -->
    <line x1="165" y1="9" x2="172" y2="9" stroke-width="1.3"/>
    <line x1="164" y1="14" x2="173" y2="14" stroke-width="1.3"/>
    <line x1="163" y1="19" x2="174" y2="19" stroke-width="1.3"/>
  </g>

  <!-- Chimney 2 (x=184, taller) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <line x1="183" y1="2" x2="181" y2="22"/>
    <line x1="186" y1="2" x2="188" y2="22"/>
    <line x1="182" y1="2" x2="187" y2="2"/>
    <!-- Inspection platforms -->
    <line x1="181" y1="6" x2="188" y2="6" stroke-width="1.3"/>
    <line x1="180" y1="11" x2="189" y2="11" stroke-width="1.3"/>
    <line x1="179" y1="17" x2="190" y2="17" stroke-width="1.3"/>
  </g>

  <!-- Substation High-Voltage Gantries on Right (x 238 to 258) -->
  <g stroke="url(#stationFadeGrad)" stroke-width="0.9" stroke-linecap="round">
    <line x1="242" y1="30" x2="242" y2="52"/>
    <line x1="254" y1="30" x2="254" y2="52"/>
    <line x1="238" y1="33" x2="258" y2="33"/>
    <line x1="242" y1="30" x2="254" y2="40"/>
    <line x1="254" y1="30" x2="242" y2="40"/>
    <line x1="242" y1="40" x2="254" y2="52"/>
    <line x1="254" y1="40" x2="242" y2="52"/>
    <!-- Insulators -->
    <line x1="244" y1="33" x2="244" y2="37" stroke-width="1.2"/>
    <line x1="252" y1="33" x2="252" y2="37" stroke-width="1.2"/>
  </g>
</svg>
